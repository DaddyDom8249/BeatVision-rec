name: BeatVision integration audit

on:
  push:
    branches: [main, audit-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BeatVision-rec with source submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify source repositories and assemble
        run: npm run verify

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci --legacy-peer-deps

      - name: Production frontend build
        working-directory: app/frontend
        run: npm run build

      - name: Frontend regression tests
        working-directory: app/frontend
        run: npm test -- --watchAll=false --runInBand --passWithNoTests

      - name: Check Cloudflare worker JavaScript
        working-directory: app/cloudflare-worker
        run: npm install --ignore-scripts && npm run check

      - name: Python syntax audit
        run: python -m compileall -q app/backend

      - name: Final integration audit
        run: npm run audit
